name: Package prerelease bundles

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_DATE_EPOCH: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.4'
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(tr -d '\r\n' < VERSION)"
      - name: Test release boundary
        run: |
          python -m unittest discover -s tools -p test_package_release.py
          python -m unittest discover -s tools -p test_verify_public_release.py
          python -m unittest discover -s tools -p test_check_release_readiness.py
      - name: Build allowlisted bundles
        run: python tools/package_release.py --out artifacts/ci-release
      - name: Verify extracted Linux bundle
        shell: bash
        run: |
          mkdir artifacts/ci-smoke-extract
          version=$(tr -d '\r\n' < VERSION)
          tar -xzf "artifacts/ci-release/reverse-artex-${version}-linux-amd64.tar.gz" -C artifacts/ci-smoke-extract
          python tools/verify_public_release.py --directory "artifacts/ci-smoke-extract/reverse-artex-${version}-linux-amd64" --out artifacts/ci-smoke-report
      - name: Check current source and release provenance
        run: python tools/check_release_readiness.py --release-dir artifacts/ci-release --out artifacts/ci-release-readiness.json
      - name: Retain packages for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reverse-artex-prerelease-bundles
          path: |
            artifacts/ci-release/*.zip
            artifacts/ci-release/*.tar.gz
            artifacts/ci-release/SHA256SUMS
            artifacts/ci-release/build-manifest.json
            artifacts/ci-release/source-inputs.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain Linux smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reverse-artex-linux-smoke
          path: |
            artifacts/ci-smoke-report/report.json
            artifacts/ci-release-readiness.json
          if-no-files-found: warn
          retention-days: 14

  windows-smoke:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GOMAXPROCS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download the reviewed cross-built bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-artex-prerelease-bundles
          path: artifacts/review-bundles
      - name: Verify checksums and smoke-test the actual Windows archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleRoot = (Resolve-Path -LiteralPath artifacts/review-bundles).Path
          Get-Content -LiteralPath (Join-Path $bundleRoot SHA256SUMS) | ForEach-Object {
            if ($_ -notmatch '^([0-9a-f]{64})  ([A-Za-z0-9._-]+)$') { throw 'Invalid checksum record' }
            $expectedHash, $relativeName = $Matches[1], $Matches[2]
            $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $bundleRoot $relativeName)).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) { throw "SHA-256 mismatch: $relativeName" }
          }
          $bundles = @(Get-ChildItem -LiteralPath $bundleRoot -Filter '*-windows-amd64.zip' -File)
          if ($bundles.Count -ne 1) { throw 'Expected exactly one Windows archive' }
          Expand-Archive -LiteralPath $bundles[0].FullName -DestinationPath artifacts/windows-extracted
          $roots = @(Get-ChildItem -LiteralPath artifacts/windows-extracted -Directory)
          if ($roots.Count -ne 1) { throw 'Expected exactly one package root' }
          python (Join-Path $roots[0].FullName tools/verify_public_release.py) --directory $roots[0].FullName --out artifacts/windows-smoke-report
          if ($LASTEXITCODE -ne 0) { throw 'Windows package smoke verification failed' }
      - name: Retain Windows smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reverse-artex-windows-smoke
          path: artifacts/windows-smoke-report/report.json
          if-no-files-found: warn
          retention-days: 14
